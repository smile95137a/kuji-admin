spring:
  config:
    import: optional:file:./config/application-prod-secrets.yml

  security:
    oauth2:
      client:
        registration:
          google:
            redirect-uri: https://stardo.tw/api/login/oauth2/code/{registrationId}

  datasource:
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

file:
  upload:
    base-url: https://stardo.tw/images

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    com.group.admin: INFO
  file:
    name: logs/admin-prod.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:KUJI_PRODUCTION_SECRET_KEY_2026_VERY_SECURE_DO_NOT_SHARE}
  expiration: 86400000  # 24 小時

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

app:
  base-url: ${APP_BASE_URL:}
  client-path: ${APP_CLIENT_PATH:}
  admin-path: ${APP_ADMIN_PATH:/kuji}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:gomypay}
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:}
    gomypay:
      api-url: ${GOMYPAY_API_URL:https://n.gomypay.asia/ShuntClass.aspx}
      shop-id: ${GOMYPAY_SHOP_ID:}
      transaction-password: ${GOMYPAY_TRANSACTION_PASSWORD:${GOMYPAY_HASH_KEY:}}
      hash-key: ${GOMYPAY_HASH_KEY:}
      hash-iv: ${GOMYPAY_HASH_IV:}
      verify-customer-id: ${GOMYPAY_VERIFY_CUSTOMER_ID:${GOMYPAY_SHOP_ID:}}
      return-url: ${GOMYPAY_RETURN_URL:}
      notify-url: ${GOMYPAY_NOTIFY_URL:}
      recharge-return-url: ${GOMYPAY_RECHARGE_RETURN_URL:}
      recharge-notify-url: ${GOMYPAY_RECHARGE_NOTIFY_URL:}
      shipping-return-url: ${GOMYPAY_SHIPPING_RETURN_URL:}
      shipping-notify-url: ${GOMYPAY_SHIPPING_NOTIFY_URL:}

aws:
  s3:
    bucket-name: test-ourkuji
    region: ap-northeast-1
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    base-url: https://stardo.tw/images
