<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>驗證您的帳號</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
            color: #333333;
            line-height: 1.6;
        }
        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333333;
        }
        .message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 20px;
        }
        .code-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin: 30px 0;
        }
        .verification-code {
            font-size: 36px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 8px;
            font-family: 'Courier New', monospace;
        }
        .code-label {
            color: #ffffff;
            font-size: 12px;
            margin-top: 10px;
            opacity: 0.9;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            font-size: 13px;
            color: #856404;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <h1>🎉 歡迎加入 KUJI</h1>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="greeting">
                您好，<span th:text="${nickname}">用戶</span>！
            </div>
            
            <div class="message">
                感謝您註冊 KUJI 抽抽樂！請使用以下驗證碼完成帳號驗證：
            </div>
            
            <!-- Verification Code -->
            <div class="code-box">
                <div class="verification-code" th:text="${verificationCode}">123456</div>
                <div class="code-label">驗證碼</div>
            </div>
            
            <!-- Warning -->
            <div class="warning">
                ⚠️ <strong>重要提醒：</strong><br>
                • 此驗證碼將在 <strong>15 分鐘</strong>後失效<br>
                • 請勿將驗證碼分享給任何人<br>
                • 如果您沒有註冊帳號，請忽略此郵件
            </div>
            
            <div class="message" style="margin-top: 30px; font-size: 13px; color: #999;">
                此郵件由系統自動發送，請勿直接回覆。
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>© 2026 KUJI 抽抽樂. All rights reserved.</p>
            <p>
                <a href="#">隱私政策</a> | 
                <a href="#">服務條款</a> | 
                <a href="#">聯絡我們</a>
            </p>
        </div>
    </div>
</body>
</html>
