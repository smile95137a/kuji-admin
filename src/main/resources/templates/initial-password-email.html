<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>後台帳號初始密碼</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
            color: #333333;
            line-height: 1.6;
        }
        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333333;
        }
        .message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 20px;
        }
        .password-box {
            background: linear-gradient(135deg, #2c3e50 0%, #4a6fa5 100%);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin: 30px 0;
        }
        .password-label {
            color: #ffffff;
            font-size: 13px;
            margin-bottom: 10px;
            opacity: 0.9;
        }
        .initial-password {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            font-size: 13px;
            color: #856404;
        }
        .login-button {
            display: inline-block;
            background: #4a6fa5;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin: 10px 0;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>🔐 後台帳號初始密碼</h1>
        </div>

        <div class="content">
            <div class="greeting">
                您好，<span th:text="${displayName}">管理員</span>！
            </div>

            <div class="message">
                管理員已為您建立後台帳號，請使用以下初始密碼登入，並在首次登入後立即修改密碼：
            </div>

            <div class="password-box">
                <div class="password-label">初始密碼</div>
                <div class="initial-password" th:text="${initialPassword}">TempPass123</div>
            </div>

            <div class="message" style="text-align: center;">
                <a th:href="${loginUrl}" class="login-button">前往登入</a>
            </div>

            <div class="warning">
                ⚠️ <strong>重要提醒：</strong><br>
                • 請於首次登入後立即修改密碼<br>
                • 請勿將密碼分享給任何人<br>
                • 如果您沒有申請此帳號，請聯絡管理員
            </div>

            <div class="message" style="margin-top: 30px; font-size: 13px; color: #999;">
                此郵件由系統自動發送，請勿直接回覆。
            </div>
        </div>

        <div class="footer">
            <p>© 2026 KUJI 抽抽樂. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
