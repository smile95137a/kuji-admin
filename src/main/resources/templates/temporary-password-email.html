<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>臨時密碼通知</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #1f4f99 0%, #2f6fed 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 36px 30px;
            color: #333333;
            line-height: 1.6;
        }
        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 18px;
        }
        .password-box {
            background: #f5f7fa;
            border: 1px solid #dbe5f5;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
            margin: 24px 0;
        }
        .password-label {
            color: #6b7280;
            font-size: 12px;
            margin-bottom: 6px;
        }
        .temporary-password {
            font-size: 24px;
            font-weight: 700;
            color: #1f4f99;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }
        .login-button {
            display: inline-block;
            background: #2f6fed;
            color: #ffffff;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 14px;
            margin: 20px 0;
            font-size: 13px;
            color: #856404;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            <h1>臨時密碼通知</h1>
        </div>

        <div class="content">
            <div class="greeting">
                您好，<span th:text="${displayName}">使用者</span>
            </div>

            <div class="message">
                系統已受理您的 <span th:text="${scene}">忘記密碼</span> 需求，請先使用下方臨時密碼登入。
            </div>

            <div class="password-box">
                <div class="password-label">臨時密碼</div>
                <div class="temporary-password" th:text="${temporaryPassword}">TempPass123</div>
            </div>

            <div class="message" style="text-align:center;">
                <a class="login-button" th:href="${loginUrl}">前往登入</a>
            </div>

            <div class="warning">
                <strong>重要提醒：</strong><br>
                1. 使用臨時密碼登入後，必須立即修改密碼。<br>
                2. 修改完成前，帳號無法進行一般操作。<br>
                3. 若非本人操作，請儘速聯繫客服。
            </div>

            <div class="message" style="margin-top:24px;font-size:12px;color:#999;">
                此郵件由系統自動發送，請勿直接回覆。
            </div>
        </div>

        <div class="footer">
            <p>© 2026 KUJI 抽抽樂. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
