<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重設密碼</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 40px 30px;
            color: #333333;
            line-height: 1.6;
        }
        .greeting {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333333;
        }
        .message {
            font-size: 14px;
            color: #666666;
            margin-bottom: 30px;
        }
        .button-container {
            text-align: center;
            margin: 30px 0;
        }
        .reset-button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            padding: 14px 40px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }
        .reset-button:hover {
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.6);
            transform: translateY(-2px);
        }
        .token-box {
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 6px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
        }
        .token-text {
            font-family: 'Courier New', monospace;
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            word-break: break-all;
        }
        .warning {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            font-size: 13px;
            color: #856404;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #dee2e6;
        }
        .footer a {
            color: #667eea;
            text-decoration: none;
        }
        .expiry-time {
            color: #dc3545;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <h1>🔐 重設密碼</h1>
        </div>
        
        <!-- Content -->
        <div class="content">
            <div class="greeting">
                您好，<span th:text="${nickname}">用戶</span>！
            </div>
            
            <div class="message">
                我們收到了您的密碼重設請求。請點擊下方按鈕來重設您的密碼：
            </div>
            
            <!-- Reset Button -->
            <div class="button-container">
                <a th:href="${resetUrl}" class="reset-button">
                    重設密碼
                </a>
            </div>
            
            <!-- Token Display (備用) -->
            <div class="message" style="margin-top: 30px;">
                如果按鈕無法使用，請複製以下驗證碼手動完成密碼重設：
            </div>
            <div class="token-box">
                <div class="token-text" th:text="${resetToken}">ABC123XYZ</div>
            </div>
            
            <!-- Warning -->
            <div class="warning">
                ⚠️ <strong>重要提醒：</strong><br>
                • 此驗證碼將在 <span class="expiry-time" th:text="${expiryMinutes}">30</span> 分鐘後失效<br>
                • 如果您沒有要求重設密碼，請忽略此郵件<br>
                • 請勿將此驗證碼分享給任何人
            </div>
            
            <div class="message" style="margin-top: 30px; font-size: 13px; color: #999;">
                此郵件由系統自動發送，請勿直接回覆。
            </div>
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p>© 2026 KUJI 抽抽樂. All rights reserved.</p>
            <p>
                <a href="#">隱私政策</a> | 
                <a href="#">服務條款</a> | 
                <a href="#">聯絡我們</a>
            </p>
        </div>
    </div>
</body>
</html>
