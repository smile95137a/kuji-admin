spring:
  application:
    name: admin

  # 預設 Profile
  profiles:
    active: dev

  # 完全關閉 DevTools
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
    add-properties: false

  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.group: DEBUG
