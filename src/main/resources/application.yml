spring:
  application:
    name: admin

  # 預設 Profile - 開發環境（本地開發）
  # UAT/正式部署時請使用 -Dspring.profiles.active=uat 或 prod
  profiles:
    active: dev

  # 完全關閉 DevTools
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
    add-properties: false

  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null  # 排除 null 欄位

  # 郵件設定（Gmail SMTP）
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            # redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            redirect-uri: "http://localhost:8180/api/login/oauth2/code/{registrationId}"
            client-name: Google

server:
  port: 8080
  servlet:
    context-path: /api

# Actuator 配置（健康檢查端點）
management:
  endpoints:
    web:
      exposure:
        include: health,info  # 只開放 health 和 info 端點
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # 只有認證用戶才能看詳細資訊
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    com.group: DEBUG

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.group.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: false
    aggressive-lazy-loading: false

# 本地檔案上傳設定（暫時替代 S3）
file:
  upload:
    base-path: src/main/resources/static/img  # 檔案儲存路徑
    base-url: http://localhost:8080           # 前端存取的 base URL

# 應用程式設定
app:
  name: KUJI 一番賞
  base-url: ${APP_BASE_URL:http://localhost:3000}
  client-path: ${APP_CLIENT_PATH:/client}
  admin-path: ${APP_ADMIN_PATH:/kuji}

jwt:
  secret: ${JWT_SECRET:myDevSecret123}  # 開發環境預設值，UAT/正式環境請由外部設定覆蓋

payment:
  gateway:
    provider: gomypay                   # stub | gomypay
    stub:
      always-success: true
    callback-base-url: http://localhost:8080
    gomypay:
      api-url: https://n.gomypay.asia/TestShuntClass.aspx    # 測試環境；正式: https://n.gomypay.asia/ShuntClass.aspx
      shop-id: ${GOMYPAY_SHOP_ID:TestShopId}              # 商店代號（向 GoMyPay 申請）
      hash-key: ${GOMYPAY_HASH_KEY:TestHashKey}           # Hash Key（向 GoMyPay 申請）
      hash-iv: ${GOMYPAY_HASH_IV:TestHashIV}              # Hash IV（向 GoMyPay 申請）
      verify-customer-id: ${GOMYPAY_VERIFY_CUSTOMER_ID:${GOMYPAY_SHOP_ID:TestShopId}}
      return-url: ${GOMYPAY_RETURN_URL}
      notify-url: ${GOMYPAY_NOTIFY_URL}
      recharge-return-url: ${GOMYPAY_RECHARGE_RETURN_URL}
      recharge-notify-url: ${GOMYPAY_RECHARGE_NOTIFY_URL}
      shipping-return-url: ${GOMYPAY_SHIPPING_RETURN_URL}
      shipping-notify-url: ${GOMYPAY_SHIPPING_NOTIFY_URL}

wallet:
  recharge-order:
    ttl-minutes: 30
  optimistic-lock:
    max-retries: 3
