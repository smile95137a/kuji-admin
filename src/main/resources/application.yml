spring:
  application:
    name: admin

  # 預設 Profile - 開發環境（本地開發）
  # UAT/正式部署時請使用 -Dspring.profiles.active=uat 或 prod
  profiles:
    active: dev

  # 完全關閉 DevTools
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
    add-properties: false

  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd'T'HH:mm:ss
    default-property-inclusion: non_null  # 排除 null 欄位

  # 郵件設定（Amazon SES SMTP）
  mail:
    host: email-smtp.ap-northeast-1.amazonaws.com
    port: 587
    username: ${SES_SMTP_USERNAME:}
    password: ${SES_SMTP_PASSWORD:}
    from: ${MAIL_FROM:system@stardo.tw}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    default-encoding: UTF-8

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Google

server:
  port: 8080
  servlet:
    context-path: /api

# Actuator 配置（健康檢查端點）
management:
  endpoints:
    web:
      exposure:
        include: health,info  # 只開放 health 和 info 端點
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # 只有認證用戶才能看詳細資訊
  health:
    defaults:
      enabled: true

logging:
  level:
    root: INFO
    com.group: DEBUG

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.group.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    lazy-loading-enabled: false
    aggressive-lazy-loading: false

# 本地檔案上傳設定（暫時替代 S3）
file:
  upload:
    base-path: src/main/resources/static/img  # 檔案儲存路徑
    base-url: http://localhost:8080           # 前端存取的 base URL

# 應用程式設定
app:
  name: KUJI 一番賞
  base-url: ${APP_BASE_URL:http://localhost:3000}
  client-path: ${APP_CLIENT_PATH:/client}
  admin-path: ${APP_ADMIN_PATH:/kuji}

jwt:
  secret: ${JWT_SECRET:myDevSecret123}  # 開發環境預設值，UAT/正式環境請由外部設定覆蓋

payment:
  gateway:
    provider: gomypay                   # stub | gomypay
    stub:
      always-success: true
    callback-base-url: http://localhost:8080
    gomypay:
      api-url: https://n.gomypay.asia/TestShuntClass.aspx    # 測試環境；正式: https://n.gomypay.asia/ShuntClass.aspx
      shop-id: ${GOMYPAY_SHOP_ID:TestShopId}              # 商店代號（向 GoMyPay 申請）
      transaction-password: ${GOMYPAY_TRANSACTION_PASSWORD:${GOMYPAY_HASH_KEY:TestHashKey}}
      hash-key: ${GOMYPAY_HASH_KEY:TestHashKey}           # Hash Key（向 GoMyPay 申請）
      hash-iv: ${GOMYPAY_HASH_IV:TestHashIV}              # Hash IV（向 GoMyPay 申請）
      verify-customer-id: ${GOMYPAY_VERIFY_CUSTOMER_ID:${GOMYPAY_SHOP_ID:TestShopId}}
      return-url: ${GOMYPAY_RETURN_URL}
      notify-url: ${GOMYPAY_NOTIFY_URL}
      recharge-return-url: ${GOMYPAY_RECHARGE_RETURN_URL}
      recharge-notify-url: ${GOMYPAY_RECHARGE_NOTIFY_URL}
      shipping-return-url: ${GOMYPAY_SHIPPING_RETURN_URL}
      shipping-notify-url: ${GOMYPAY_SHIPPING_NOTIFY_URL}

wallet:
  recharge-order:
    ttl-minutes: 30
  optimistic-lock:
    max-retries: 3

logistics:
  provider: ${LOGISTICS_PROVIDER:gomypay}
  gomypay:
    logistics-api-url: ${GOMYPAY_LOGISTICS_API_URL:https://logistics.gomypay.asia/LogisticsAPI.aspx}
    status-check-url: ${GOMYPAY_LOGISTICS_STATUS_CHECK_URL:https://logistics.gomypay.asia/LogisticsStatusCheck.aspx}
    print-url: ${GOMYPAY_LOGISTICS_PRINT_URL:https://logistics.gomypay.asia/LogisticsPrint.aspx}
    store-selector-url: ${GOMYPAY_LOGISTICS_SELECTOR_URL:https://logistics.gomypay.asia/Logisticstm.aspx}
    sf-create-api-url: ${GOMYPAY_LOGISTICS_SF_CREATE_API_URL:https://logistics.gomypay.asia/Api/SF/SFCreateAPI.aspx}
    sf-print-api-url: ${GOMYPAY_LOGISTICS_SF_PRINT_API_URL:https://logistics.gomypay.asia/Api/SF/SFPrintAPI.aspx}
    sf-track-api-url: ${GOMYPAY_LOGISTICS_SF_TRACK_API_URL:https://logistics.gomypay.asia/Api/SF/SFOrderTrack.aspx}
    eshop-id: ${GOMYPAY_LOGISTICS_ESHOP_ID:${GOMYPAY_SHOP_ID:}}
    secret: ${GOMYPAY_LOGISTICS_SECRET:${GOMYPAY_HASH_KEY:}}
    callback-url: ${GOMYPAY_LOGISTICS_CALLBACK_URL:}
    sender-name: ${GOMYPAY_LOGISTICS_SENDER_NAME:}
    sender-mobile: ${GOMYPAY_LOGISTICS_SENDER_MOBILE:}
    sender-region: ${GOMYPAY_LOGISTICS_SENDER_REGION:TW}
    sender-zip-code: ${GOMYPAY_LOGISTICS_SENDER_ZIP_CODE:}
    sender-address: ${GOMYPAY_LOGISTICS_SENDER_ADDRESS:}
    product-type-id: ${GOMYPAY_LOGISTICS_PRODUCT_TYPE_ID:0015}
    product-name: ${GOMYPAY_LOGISTICS_PRODUCT_NAME:KUJI獎品}
    sf-pickup-type: ${GOMYPAY_LOGISTICS_SF_PICKUP_TYPE:0}
    sf-total-weight: ${GOMYPAY_LOGISTICS_SF_TOTAL_WEIGHT:1}
    sf-quantity: ${GOMYPAY_LOGISTICS_SF_QUANTITY:1}
