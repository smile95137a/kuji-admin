spring:
  application:
    name: admin

  # 預設 Profile
  profiles:
    active: dev

  # 完全關閉 DevTools
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
    add-properties: false

  jackson:
    time-zone: Asia/Taipei
    date-format: yyyy-MM-dd HH:mm:ss

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.group: DEBUG

# 本地檔案上傳設定（暫時替代 S3）
file:
  upload:
    base-path: src/main/resources/static/img  # 檔案儲存路徑
    base-url: http://localhost:8080           # 前端存取的 base URL
