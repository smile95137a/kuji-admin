spring:
  datasource:
    url: jdbc:mysql://database-1.clsi2geo699r.ap-northeast-1.rds.amazonaws.com:3306/kuji?useSSL=true&serverTimezone=Asia/Taipei&characterEncoding=UTF-8
    username: admin
    password: WUfan0667.
    driver-class-name: com.mysql.cj.jdbc.Driver
  config:
    import: optional:file:./config/application-dev-secrets.yml

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope:
              - openid
              - profile
              - email
            redirect-uri: "http://localhost:8180/api/login/oauth2/code/{registrationId}"
            client-name: Google

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8180

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    # MyBatis SQL 日誌
    com.group.admin.mapper: DEBUG
    com.group.admin.config.CorsConfig: DEBUG

# 開發環境 CORS - 允許本地前端
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  client-path: ${APP_CLIENT_PATH:/client}
  admin-path: ${APP_ADMIN_PATH:/kuji}

jwt:
  secret: ${JWT_SECRET:myDevSecret123}

google:
  client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
  client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}

payment:
  gateway:
    provider: ${PAYMENT_GATEWAY_PROVIDER:stub}
    callback-base-url: ${PAYMENT_CALLBACK_BASE_URL:http://localhost:8180}
    gomypay:
      api-url: ${GOMYPAY_API_URL:https://n.gomypay.asia/TestShuntClass.aspx}
      shop-id: ${GOMYPAY_SHOP_ID:TestShopId}
      hash-key: ${GOMYPAY_HASH_KEY:TestHashKey}
      hash-iv: ${GOMYPAY_HASH_IV:TestHashIV}
      verify-customer-id: ${GOMYPAY_VERIFY_CUSTOMER_ID:${GOMYPAY_SHOP_ID:TestShopId}}
      return-url: ${GOMYPAY_RETURN_URL:http://localhost:5173/client/member-center/order-payment-result}
      notify-url: ${GOMYPAY_NOTIFY_URL:http://localhost:8180/api/payment/shipping/callback}
      recharge-return-url: ${GOMYPAY_RECHARGE_RETURN_URL:http://localhost:5173/client/member-center/deposit-payment-result}
      recharge-notify-url: ${GOMYPAY_RECHARGE_NOTIFY_URL:http://localhost:8180/api/wallet/recharge/callback}
      shipping-return-url: ${GOMYPAY_SHIPPING_RETURN_URL:http://localhost:5173/client/member-center/order-payment-result}
      shipping-notify-url: ${GOMYPAY_SHIPPING_NOTIFY_URL:http://localhost:8180/api/payment/shipping/callback}

# AWS S3 配置（開發環境也使用 S3）
# ⚠️ 憑證已移至環境變數，請在啟動前設定：
#   export AWS_ACCESS_KEY_ID=your_access_key
#   export AWS_SECRET_ACCESS_KEY=your_secret_key
aws:
  s3:
    bucket-name: test-ourkuji
    region: ap-northeast-1
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    base-url: https://test-ourkuji.s3.ap-northeast-1.amazonaws.com
