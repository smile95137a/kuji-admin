name: Build and Deploy Prod

on:
  pull_request:
    branches:
      - develop
      - prod
  push:
    branches:
      - develop
      - prod

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  JAR_PATH: target/admin-1.0.0.jar
  REMOTE_TMP_JAR: /home/ec2-user/admin-1.0.0.jar
  REMOTE_APP_JAR: /home/ec2-user/kuji-admin/admin-1.0.0.jar
  SERVICE_NAME: kuji-admin.service

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build prod jar
        run: mvn clean package -DskipTests -Pprod

      - name: Verify jar exists
        run: test -f "$JAR_PATH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuji-admin-prod-jar
          path: ${{ env.JAR_PATH }}
          if-no-files-found: error
          retention-days: 7

  deploy-prod:
    name: Deploy Prod
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: kuji-admin-prod-jar
          path: target

      - name: Prepare SSH
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_PORT: ${{ secrets.PROD_EC2_PORT }}
          PROD_EC2_SSH_KEY: ${{ secrets.PROD_EC2_SSH_KEY }}
        run: |
          test -n "$PROD_EC2_HOST"
          test -n "$PROD_EC2_SSH_KEY"
          SSH_PORT="${PROD_EC2_PORT:-22}"
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" "$PROD_EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload jar to EC2
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_PORT: ${{ secrets.PROD_EC2_PORT }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
        run: |
          SSH_PORT="${PROD_EC2_PORT:-22}"
          SSH_USER="${PROD_EC2_USER:-ec2-user}"
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" "$JAR_PATH" "$SSH_USER@$PROD_EC2_HOST:$REMOTE_TMP_JAR"

      - name: Restart prod service
        env:
          PROD_EC2_HOST: ${{ secrets.PROD_EC2_HOST }}
          PROD_EC2_PORT: ${{ secrets.PROD_EC2_PORT }}
          PROD_EC2_USER: ${{ secrets.PROD_EC2_USER }}
        run: |
          SSH_PORT="${PROD_EC2_PORT:-22}"
          SSH_USER="${PROD_EC2_USER:-ec2-user}"
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$PROD_EC2_HOST" "
            set -e
            cp '$REMOTE_TMP_JAR' '$REMOTE_APP_JAR'
            sudo systemctl restart '$SERVICE_NAME'
            sleep 10
            sudo systemctl status '$SERVICE_NAME' --no-pager
            sudo journalctl -u kuji-admin -n 80 --no-pager
          "
